plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

def javaRel = (project.java_release as int)

version = project.mod_version
group = 'pl.elektryn'
base { archivesName = "elektryn-${project.mc}" }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.build_mc}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

// legacy = 1.14 - 1.18.2 (pola w Options), modern = 1.19 - 1.21.11 (OptionInstance)
sourceSets.main.java.srcDir "src/${project.variant}/java"

def props = [version: project.mod_version, mc_dep: project.mc_dep, compat: "JAVA_${javaRel}".toString()]
processResources {
    inputs.properties props
    filesMatching(['fabric.mod.json', 'elektryn.mixins.json']) { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.release = javaRel }
